<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MTG Card Rater</title>
<style>
body { 
  font-family: sans-serif; 
  margin: 0; 
  padding: 0;
  background: #1e1e1e;
  color: #fff;
}
#main {
  display: flex;
  height: 100vh;
}
#sidebar {
  width: 300px;
  background: #2d2d2d;
  overflow-y: auto;
  border-right: 1px solid #444;
  padding: 20px;
}
#sidebar h2 {
  margin-top: 0;
  color: #ffd700;
}
.stat-group {
  margin-bottom: 15px;
  padding: 8px;
  background: #3d3d3d;
  border-radius: 4px;
  font-size: 14px;
}
.stat-group.active {
  background: #4a4a2a;
  border-left: 3px solid #ffd700;
}
.progress-bar {
  width: 100%;
  height: 8px;
  background: #555;
  border-radius: 4px;
  margin-top: 5px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: #4CAF50;
  transition: width 0.3s ease;
}
#content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
img { 
  max-height: 500px; 
  max-width: 350px;
  margin: 20px;
  cursor: pointer; 
  border: 2px solid transparent; 
  border-radius: 4px;
}
img:hover { 
  border-color: #ffd700; 
}
#cardContainer {
  display: flex;
  align-items: center;
  gap: 20px;
}
#cardRating {
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 10px 15px;
  border-radius: 4px;
  font-weight: bold;
  font-size: 18px;
  min-width: 40px;
  text-align: center;
}
#cardInfo {
  text-align: center;
  margin-bottom: 20px;
}
#cardName {
  font-size: 24px;
  font-weight: bold;
  color: #ffd700;
}
#cardType {
  font-size: 14px;
  color: #aaa;
  margin-top: 5px;
}
#ratingButtons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}
.rating-btn {
  font-size: 18px;
  padding: 12px 20px;
  background: #3d3d3d;
  color: #fff;
  border: 2px solid #555;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.rating-btn:hover {
  background: #4a4a4a;
  border-color: #ffd700;
}
.rating-btn.active {
  background: #ffd700;
  color: #000;
}
.rating-btn kbd {
  font-size: 12px;
  opacity: 0.7;
  display: block;
}
#progress {
  margin-top: 20px;
  font-size: 14px;
  color: #aaa;
}
button {
  margin-top: 10px;
  padding: 10px 20px;
  font-size: 16px;
  background: #555;
  color: #fff;
  border: 1px solid #777;
  border-radius: 4px;
  cursor: pointer;
}
button:hover {
  background: #666;
}
</style>
</head>
<body>
<div id="main">
  <div id="sidebar">
    <h2>Cards Remaining</h2>
    <div id="statsList"></div>
  </div>
  <div id="content">
    <div id="cardInfo">
      <div id="cardName"></div>
      <div id="cardType"></div>
    </div>
    <div id="cardContainer">
      <img id="cardImg" />
      <div id="cardRating">U</div>
    </div>
    <div id="ratingButtons">
      <button class="rating-btn" onclick="rate('S')">S<kbd>1</kbd></button>
      <button class="rating-btn" onclick="rate('A')">A<kbd>2</kbd></button>
      <button class="rating-btn" onclick="rate('B')">B<kbd>3</kbd></button>
      <button class="rating-btn" onclick="rate('C')">C<kbd>4</kbd></button>
      <button class="rating-btn" onclick="rate('D')">D<kbd>5</kbd></button>
      <button class="rating-btn" onclick="rate('E')">E<kbd>6</kbd></button>
    </div>
    <button onclick="skip()">Skip</button>
    <button onclick="prev()">Back</button>
    <div id="progress"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
