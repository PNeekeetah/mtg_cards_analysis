[tool.poetry]
name = "mtg-cards-analysis"
version = "0.1.0"
description = "MTG card collection analysis and pricing tool"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "python_analysis_app"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.0.0"
orjson = "^3.9.0"
pydantic = "^2.0.0"
requests = "^2.31.0"
itables = "^2.0.0"
jupyter = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
mypy = "^1.5.0"
pyinstrument = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
